<link rel="icon" href="favicon.ico" sizes="any">
<style>
:root{
  --bg1:#eef8ff; --bg2:#d9edff;
  --card:#ffffff; --line:#d5e9fb;
  --ink:#1f3c5e; --ink2:#54759a; --ink3:#93b4d4;
  --accent:#66a9f0; --deep:#3f86d1;
  --ease:cubic-bezier(.22,.9,.28,1);
  --sh:0 1px 2px rgba(76,116,164,.06), 0 10px 28px rgba(120,160,210,.13);
  --sh-lg:0 2px 4px rgba(76,116,164,.08), 0 24px 50px rgba(110,155,210,.24);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  background:radial-gradient(1200px 600px at 50% -100px, #fbfdff 0%, var(--bg1) 45%, var(--bg2) 100%);
  color:var(--ink);
  font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  padding:26px 16px 90px;
  -webkit-font-smoothing:antialiased;
}
.wrap{width:100%;max-width:760px;margin:0 auto}

/* —— 顶栏 —— */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.title-block h1{font-size:23px;font-weight:800;letter-spacing:.5px}
.title-block .date{font-size:12.5px;color:var(--ink2);margin-top:5px;letter-spacing:.6px}
.ring-wrap{display:flex;align-items:center;gap:12px}
.ring{position:relative;width:64px;height:64px}
.ring svg{transform:rotate(-90deg)}
.ring .bgc{fill:none;stroke:#e2f1fd;stroke-width:7}
.ring .fgc{fill:none;stroke:url(#ringGrad);stroke-width:7;stroke-linecap:round;transition:stroke-dasharray .7s var(--ease)}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--deep)}
.ring-label{font-size:12px;color:var(--ink2);line-height:1.6}
.ring-label b{display:block;font-size:13.5px;color:var(--ink)}

/* —— 统计条 —— */
.stats{
  display:flex;gap:10px;margin:16px 0 26px;flex-wrap:wrap;
}
.stat{
  flex:1;min-width:100px;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:12px 14px;box-shadow:var(--sh);
}
.stat .k{font-size:11px;color:var(--ink3);letter-spacing:1px;font-weight:700}
.stat .v{font-size:19px;font-weight:800;margin-top:4px;color:var(--deep)}
.stat .v small{font-size:11px;color:var(--ink3);font-weight:700;margin-left:3px}

/* —— 习惯网格 —— */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.habit{
  position:relative;cursor:pointer;border-radius:22px;padding:17px 17px 15px;
  background:var(--card);border:1.5px solid var(--line);box-shadow:var(--sh);
  transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .3s ease,background .3s ease;
  user-select:none;overflow:hidden;
}
.habit:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.habit:active{transform:translateY(-1px) scale(.99)}
.habit.done{border-color:var(--hc);background:linear-gradient(160deg,#ffffff 20%, var(--hc-soft) 130%)}
.habit.pop{animation:pop .5s var(--ease)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.04)}70%{transform:scale(.99)}100%{transform:scale(1)}}
.habit .top{display:flex;align-items:center;gap:11px}
.habit .emoji{
  width:50px;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-size:26px;background:var(--hc-soft);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.habit:hover .emoji{transform:scale(1.1) rotate(-6deg)}
.habit .name{font-weight:800;font-size:14.5px;line-height:1.35}
.habit .meta{font-size:11px;color:var(--ink2);margin-top:4px;letter-spacing:.3px}
.habit .bars{display:flex;gap:4px;margin-top:13px}
.habit .bar{flex:1;height:6px;border-radius:4px;background:#e8f3fd;transition:background .35s ease}
.habit .bar.on{background:var(--hc)}
.habit .week{font-size:10.5px;color:var(--ink3);margin-top:7px;letter-spacing:.4px}
.habit .badge{
  position:absolute;top:13px;right:13px;width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;
  background:var(--hc);box-shadow:0 4px 10px rgba(80,130,190,.35);
  opacity:0;transform:scale(.3);transition:opacity .25s ease,transform .35s cubic-bezier(.34,1.56,.64,1);
}
.habit.done .badge{opacity:1;transform:scale(1)}
.habit .menu{
  position:absolute;bottom:12px;right:12px;width:28px;height:28px;border-radius:9px;border:none;cursor:pointer;
  background:#eef7ff;color:var(--ink2);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s ease,background .2s ease;
}
.habit:hover .menu,.habit .menu:focus{opacity:1}
.habit .menu:hover{background:#ddeefc}

/* —— 添加卡 —— */
.add-card{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:150px;
  border-radius:22px;border:1.7px dashed #bcd9f4;color:#7ba6cf;cursor:pointer;background:rgba(255,255,255,.5);
  font-weight:800;font-size:14px;letter-spacing:1px;
  transition:transform .2s var(--ease),border-color .2s ease,background .2s ease;
}
.add-card:hover{transform:translateY(-3px);border-color:#8fc0ec;background:#f4faff;color:var(--deep)}
.add-card .plus{font-size:30px;font-weight:400;line-height:1}

/* —— 空状态 —— */
.empty{text-align:center;padding:38px 16px 26px}
.empty .big{font-size:52px}
.empty h2{font-size:17px;margin-top:14px;font-weight:800}
.empty p{font-size:13px;color:var(--ink2);margin-top:8px;line-height:1.9}
.presets{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:20px}
.preset{
  border:1px solid #cfe6fa;background:#fff;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:700;
  color:#44709f;cursor:pointer;font-family:inherit;transition:all .2s var(--ease);
}
.preset:hover{transform:translateY(-2px);border-color:#a6d1f8;box-shadow:0 10px 22px rgba(120,160,210,.16)}

/* —— 弹层通用 —— */
.mask{
  position:fixed;inset:0;background:rgba(31,60,94,.32);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .3s ease;
}
.mask.show{opacity:1;pointer-events:auto}
.modal{
  width:100%;max-width:460px;max-height:86vh;overflow-y:auto;
  background:#fff;border-radius:24px;padding:24px;box-shadow:0 30px 80px rgba(31,60,94,.35);
  transform:translateY(22px) scale(.98);transition:transform .35s var(--ease);
}
.mask.show .modal{transform:translateY(0) scale(1)}
.modal h3{font-size:17px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.modal h3 button{border:none;background:#eef7ff;border-radius:10px;width:30px;height:30px;font-size:15px;color:var(--ink2);cursor:pointer}
.field{margin-bottom:15px}
.field .lab{font-size:12px;font-weight:800;color:var(--ink2);letter-spacing:1px;margin-bottom:8px}
.inp{
  width:100%;border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;font-size:14.5px;
  font-family:inherit;color:var(--ink);outline:none;background:#fbfdff;transition:border-color .2s ease;
}
.inp:focus{border-color:#8fc0ec}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:168px;overflow-y:auto;padding:4px}
.emoji-grid button{
  aspect-ratio:1;border:1.5px solid transparent;border-radius:12px;background:#f6fbff;font-size:19px;
  cursor:pointer;transition:all .15s ease;
}
.emoji-grid button:hover{background:#e8f4ff;transform:scale(1.08)}
.emoji-grid button.sel{border-color:var(--deep);background:#e4f2ff;transform:scale(1.06)}
.colors{display:flex;gap:9px;flex-wrap:wrap}
.colors button{width:32px;height:32px;border-radius:50%;border:3px solid #fff;cursor:pointer;box-shadow:0 0 0 1.5px #dbeaf8;transition:transform .15s ease}
.colors button.sel{transform:scale(1.18);box-shadow:0 0 0 2px var(--deep)}
.target-row{display:flex;gap:8px}
.target-row button{
  flex:1;padding:9px 0;border-radius:12px;border:1.5px solid var(--line);background:#fbfdff;
  font-weight:800;font-size:13.5px;color:var(--ink2);cursor:pointer;font-family:inherit;transition:all .15s ease;
}
.target-row button.sel{border-color:var(--deep);background:#e8f4ff;color:var(--deep)}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.btn{
  flex:1;padding:12px 0;border-radius:14px;border:none;font-size:14.5px;font-weight:800;cursor:pointer;font-family:inherit;
  transition:transform .15s ease,box-shadow .15s ease;
}
.btn-p{background:linear-gradient(180deg,#8fc5fb,#5ea3ee);color:#fff;box-shadow:0 4px 0 #4683c4}
.btn-p:active{transform:translateY(2px);box-shadow:0 2px 0 #4683c4}
.btn-g{background:#eef7ff;color:var(--ink2)}
.btn-danger{background:#ffecef;color:#d4546c}

/* —— 详情：日历 —— */
.detail-head{display:flex;align-items:center;gap:13px;margin-bottom:16px}
.detail-head .emoji{width:54px;height:54px;border-radius:17px;font-size:28px;display:flex;align-items:center;justify-content:center}
.detail-head .n{font-size:17px;font-weight:800}
.detail-head .m{font-size:12px;color:var(--ink2);margin-top:4px}
.d-stats{display:flex;gap:8px;margin-bottom:16px}
.d-stat{flex:1;background:#f6fbff;border-radius:14px;padding:10px;text-align:center}
.d-stat .v{font-size:17px;font-weight:800;color:var(--deep)}
.d-stat .k{font-size:10.5px;color:var(--ink3);margin-top:3px;font-weight:700;letter-spacing:.8px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.cal-head b{font-size:14px}
.cal-head button{border:none;background:#eef7ff;border-radius:10px;width:30px;height:30px;cursor:pointer;color:var(--ink2);font-size:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:10.5px;color:var(--ink3);font-weight:800;padding:4px 0}
.cal .d{
  aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:var(--ink2);background:#f6fbff;
}
.cal .d.on{background:var(--hc);color:#fff;box-shadow:0 3px 8px rgba(80,130,190,.28)}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--deep)}
.cal .d.on.today{box-shadow:inset 0 0 0 2px #fff,0 3px 8px rgba(80,130,190,.28)}
.cal .d.future{opacity:.35}
.cal .d.blank{background:transparent}

/* —— 提示 —— */
.toast{
  position:fixed;left:50%;bottom:30px;z-index:90;transform:translateX(-50%) translateY(16px);
  background:rgba(31,60,94,.95);color:#fff;padding:10px 20px;border-radius:999px;
  font-size:13.5px;letter-spacing:.5px;opacity:0;pointer-events:none;
  transition:opacity .35s var(--ease),transform .35s var(--ease);
  box-shadow:0 12px 30px rgba(31,60,94,.35);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* —— 🏆 成就 —— */
.ach-btn{
  border:1px solid #e8d9a8;background:linear-gradient(180deg,#fffdf4,#fff5da);
  color:#9a7c3a;font-weight:800;font-size:13px;padding:9px 16px;border-radius:999px;
  cursor:pointer;font-family:inherit;letter-spacing:.5px;
  transition:transform .2s var(--ease),box-shadow .2s ease;
  box-shadow:0 8px 18px rgba(200,160,60,.18);
}
.ach-btn:hover{transform:translateY(-2px)}
.ach-banner{
  position:fixed;top:16px;left:50%;z-index:95;
  transform:translate(-50%,-96px);
  display:flex;align-items:center;gap:13px;
  background:linear-gradient(135deg,#fffef7,#fff3d4);
  border:1.5px solid #f0d78c;border-radius:18px;
  padding:12px 22px 12px 15px;box-shadow:0 18px 44px rgba(160,120,40,.32);
  opacity:0;pointer-events:none;
  transition:transform .5s var(--ease),opacity .4s ease;
}
.ach-banner.show{transform:translate(-50%,0);opacity:1}
.ach-banner .emo{font-size:31px;animation:achPop .7s cubic-bezier(.34,1.56,.64,1)}
@keyframes achPop{0%{transform:scale(.3) rotate(-18deg)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.ach-banner .t1{font-size:10.5px;font-weight:800;letter-spacing:2.5px;color:#b8892e}
.ach-banner .t2{font-size:15.5px;font-weight:800;color:#6b4f12;margin-top:2px}
.ach-banner .t3{font-size:11.5px;color:#9a7c3a;margin-top:1px}
.ach-item{display:flex;gap:10px;align-items:center;background:#fff8ea;border:1px solid #f0e2bf;border-radius:15px;padding:10px 12px}
.ach-item.locked{opacity:.6;filter:grayscale(.9);background:#f7f4ec;border-color:#e7e0d2}
.ach-item .ae{font-size:23px;width:30px;text-align:center}
.ach-item .an{font-size:12.5px;font-weight:800;color:#5a4318}
.ach-item .ad{font-size:10.5px;color:#9a8a66;margin-top:2px;line-height:1.5}
.ach-grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media (max-width:480px){.ach-grid2{grid-template-columns:1fr}}

/* —— 页脚 —— */
footer{margin-top:54px;text-align:center;color:#8fb2d4;font-size:12px;letter-spacing:.5px;line-height:2.2}
footer button{
  border:1px solid #cfe6fa;background:#fff;border-radius:999px;padding:7px 15px;margin:0 4px;
  font-size:12px;font-weight:700;color:#44709f;cursor:pointer;font-family:inherit;transition:all .2s ease;
}
footer button:hover{border-color:#a6d1f8;transform:translateY(-1px)}

@media (max-width:480px){
  body{padding:20px 13px 80px}
  .title-block h1{font-size:20px}
  .grid{grid-template-columns:repeat(2,1fr);gap:11px}
  .habit{padding:14px 13px 12px;border-radius:19px}
  .habit .emoji{width:44px;height:44px;font-size:23px;border-radius:14px}
  .habit .name{font-size:13.5px}
  .emoji-grid{grid-template-columns:repeat(7,1fr)}
  .modal{padding:20px;border-radius:22px}
}
/* —— 返回主页（全站统一 · 2026-09-29）—— */
.wb-home{position:fixed;left:14px;bottom:14px;z-index:9990;display:inline-flex;align-items:center;gap:5px;
  padding:8px 13px 8px 10px;border-radius:999px;text-decoration:none;
  background:rgba(17,24,39,.55);color:#fff;font-size:12.5px;font-weight:600;letter-spacing:.3px;
  -webkit-backdrop-filter:blur(10px) saturate(1.3);backdrop-filter:blur(10px) saturate(1.3);
  border:1px solid rgba(255,255,255,.14);box-shadow:0 6px 18px rgba(0,0,0,.18);
  transition:background .2s,transform .2s,box-shadow .2s}
.wb-home:hover{background:rgba(17,24,39,.78);transform:translateY(-1px);box-shadow:0 10px 24px rgba(0,0,0,.26)}
.wb-home:active{transform:translateY(0)}
.wb-home svg{width:13px;height:13px;flex:0 0 auto}
@media (max-width:620px){ .wb-home{left:10px;bottom:10px;padding:7px 11px 7px 9px;font-size:12px} }
</style>
